<!--
  ink_overlaps.svg - FIXTURE for the rendered-ink overlap check.
  Each planted defect carries data-expect="<class>" on both elements of the
  pair; the test asserts the checker reports exactly those pairs and nothing
  for the passing cases (label inside its pill, chip nested in a card, a
  connector touching its source and target, an arrowhead touching its target, a hidden guide group and a
  transparent full-canvas plate).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Arial, Helvetica, sans-serif">
  <style>
    .fg { fill: #14151a; }
    .tint { fill: #b91c1c; }
    .s-line { stroke: #b91c1c; }
    .s-grey { stroke: #676e7e; }
    @media (prefers-color-scheme: dark) {
      .fg { fill: #eaedf1; }
      .tint { fill: #f87171; }
      .s-line { stroke: #f87171; }
      .s-grey { stroke: #8c92a1; }
    }
  </style>

  <rect id="plate" x="0" y="0" width="640" height="360" fill="transparent"/>
  <g id="guide-grid" display="none">
    <line x1="320" y1="0" x2="320" y2="360" stroke="red"/>
  </g>

  <g id="nodes">
    <!-- PASS 1: label inside its pill -->
    <rect id="pass-pill" class="tint s-line" fill-opacity="0.06" stroke-width="1.5" x="20" y="30" width="160" height="40" rx="20"/>
    <!-- PASS 2: chip nested inside a card -->
    <rect id="pass-card" class="tint s-grey" fill-opacity="0.06" stroke-width="1" x="200" y="20" width="140" height="80" rx="6"/>
    <rect id="pass-chip" class="tint s-line" fill-opacity="0.1" stroke-width="1" x="216" y="60" width="60" height="20" rx="10"/>
    <!-- FAIL 1: two shapes partly overlap (y 60-70) -->
    <rect id="fail-badge" data-expect="shapes-partly-overlap" class="tint s-grey" fill-opacity="0.06" stroke-width="1" x="380" y="20" width="120" height="50" rx="6"/>
    <rect id="fail-pill" data-expect="shapes-partly-overlap" class="tint s-line" fill-opacity="0.06" stroke-width="1.5" x="360" y="60" width="160" height="36" rx="18"/>
    <!-- FAIL 2: the pill's top edge runs through the text -->
    <rect id="fail-edge-pill" data-expect="edge-crosses-text" class="tint s-line" fill-opacity="0.06" stroke-width="1.5" x="20" y="150" width="180" height="36" rx="18"/>
    <!-- FAIL 4: text runs past the right side of an unstroked box -->
    <rect id="fail-short-box" data-expect="text-straddles-shape" class="tint" fill-opacity="0.15" x="400" y="140" width="90" height="30"/>
    <!-- PASS 3: connector source and target -->
    <rect id="pass-source" class="tint s-line" fill-opacity="0.06" stroke-width="1.5" x="20" y="240" width="120" height="30" rx="15"/>
    <rect id="pass-target" class="tint s-line" fill-opacity="0.06" stroke-width="1.5" x="20" y="320" width="120" height="30" rx="15"/>
    <!-- SOFT 1: an arrowhead aimed at pass-target-3 passes 0.5 px beside this box -->
    <rect id="near-box" data-expect="clearance" class="tint s-grey" fill-opacity="0.06" stroke-width="1" x="240" y="250" width="120" height="80"/>
    <rect id="pass-target-3" class="tint s-line" fill-opacity="0.06" stroke-width="1.5" x="200" y="336" width="70" height="20" rx="10"/>
    <!-- SOFT 2: text 2 px inside this box's left edge -->
    <rect id="tight-box" data-expect="clearance" class="tint s-grey" fill-opacity="0.06" stroke-width="1.5" x="400" y="250" width="160" height="50"/>
  </g>

  <g id="connectors">
    <g id="pass-connector">
      <line class="s-line" x1="80" y1="270" x2="80" y2="312" stroke-width="2"/>
      <polygon class="tint" points="74,312 86,312 80,320"/>
    </g>
    <g id="near-connector">
      <line class="s-line" x1="234" y1="230" x2="234" y2="328" stroke-width="2"/>
      <polygon id="near-arrowhead" data-expect="clearance" class="tint" points="229,328 239,328 234,336"/>
    </g>
  </g>

  <g id="content">
    <text class="fg" x="100" y="55" font-size="13" font-weight="700" text-anchor="middle">CLEAN LABEL</text>
    <text class="fg" x="212" y="42" font-size="12" font-weight="700">CARD TITLE</text>
    <text class="fg" x="246" y="74" font-size="10" text-anchor="middle">CHIP</text>
    <text id="fail-edge-text" data-expect="edge-crosses-text" class="fg" x="40" y="154" font-size="12">CROSSED BY EDGE</text>
    <text id="fail-text-a" data-expect="text-on-text" class="fg" x="230" y="160" font-size="14">FIRST LINE</text>
    <text id="fail-text-b" data-expect="text-on-text" class="fg" x="240" y="166" font-size="14">SECOND LINE</text>
    <text id="fail-long-text" data-expect="text-straddles-shape" class="fg" x="410" y="160" font-size="12">OVERFLOWING LABEL</text>
    <text class="fg" x="80" y="260" font-size="11" font-weight="700" text-anchor="middle">SOURCE</text>
    <text class="fg" x="80" y="340" font-size="11" font-weight="700" text-anchor="middle">TARGET</text>
    <text id="tight-text" data-expect="clearance" class="fg" x="402" y="270" font-size="12">TIGHT</text>
  </g>
</svg>
