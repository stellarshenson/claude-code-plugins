[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stellars_claude_code_plugins"
version = "1.5.2"
description = "Claude Code plugins for autonomous development workflows"
authors = [
    { name = "Stellars Henson", email = "konrad.jelen@gmail.com" },
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12.0"
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "arviz>=0.17",
    "argostranslate>=1.9",          # lexical high tier: torch-free MT (CTranslate2)
    "bambi>=0.13",
    "beziers",
    "ctranslate2>=4.0",             # lexical high tier: MT inference engine
    "fonttools",
    "lingua-language-detector>=2.0",  # lexical medium tier: per-claim language detection
    "nltk>=3.8",                    # lexical medium tier: WordNet antonym-flip (corpus fetched lazily)
    "numpy",
    "odfpy>=1.4",
    "pandas>=2.0",
    "pillow",
    "playwright",
    "pyarrow>=14.0",                # lexical: parquet gold read in train-lexical
    "pygal",
    "pymc>=5.10",
    "pypdf>=4.0",
    "python-docx>=1.0",
    "pyyaml",
    "rank-bm25>=0.2.2",
    "rapidfuzz>=3.14.5",
    "sacremoses>=0.1",              # lexical high tier: MT tokenisation
    "scikit-learn>=1.3",           # lexical: manifold fit path (LogisticRegression); not imported at inference
    "scipy",
    "sentencepiece>=0.2",          # lexical high tier: MT subword model
    "shapely",
    "striprtf>=0.0.26",
    "subword-nmt>=0.3",            # lexical high tier: MT BPE
    "svgelements>=1.9",
    "openvino>=2025.0",            # lexical high tier: native INT8 SaT sentence splitter (LATENCY hint)
    "tiktoken",
    "tokenizers>=0.20",            # lexical high tier: xlm-roberta tokenizer for SaT
    "transitions",
    "wordfreq>=3.0",               # lexical: length-robust background token rarity (recall + distinctive-content)
]

[project.optional-dependencies]
dev = [
    "build",
    "ipython",
    "pip",
    "pytest",
    "pytest-cov",
    "ruff",
    "twine",
]
semantic = [
    "onnxruntime>=1.17",
    "transformers>=4.40",
    "huggingface_hub>=0.23",
    "faiss-cpu>=1.7",
    "pyarrow>=14.0",
]
ocr = [
    "pytesseract>=0.3.10",
    "pdf2image>=1.17.0",
    "langdetect>=1.0.9",
]

[project.scripts]
orchestrate = "stellars_claude_code_plugins.autobuild.orchestrator:main"
svg-infographics = "stellars_claude_code_plugins.svg_tools.cli:main"
journal-tools = "stellars_claude_code_plugins.journal.journal_tools:main"
render-png = "stellars_claude_code_plugins.svg_tools.render_png:main"
document-processing = "stellars_claude_code_plugins.document_processing.cli:main"

[project.urls]
Homepage = "https://github.com/stellarshenson/claude-code-plugins"
Repository = "https://github.com/stellarshenson/claude-code-plugins"
Issues = "https://github.com/stellarshenson/claude-code-plugins/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"stellars_claude_code_plugins" = ["config_*.yaml"]
"stellars_claude_code_plugins.autobuild" = ["resources/*.yaml"]
"stellars_claude_code_plugins.journal" = ["prompts/*.yaml"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["stellars_claude_code_plugins*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 99
src = ["src"]
include = ["pyproject.toml", "src/stellars_claude_code_plugins/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["stellars_claude_code_plugins"]
force-sort-within-sections = true
