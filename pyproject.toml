[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stellars_claude_code_plugins"
version = "1.7.16"
description = "Claude Code plugins for autonomous development workflows"
authors = [
    { name = "Stellars Henson", email = "konrad.jelen@gmail.com" },
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"  # see the groundrails marker in [dependencies]
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "beziers",
    "fonttools",
    # Grounding engine for document-processing; pulls the grounder runtime stack
    # transitively. groundrails pins ~=3.12.0, and inheriting that pin project-wide
    # capped the WHOLE toolkit at 3.12, silently downgrading 3.13 installs. The
    # marker confines the 3.12 requirement to the one subsystem that needs it;
    # every other CLI installs across the whole 3.11+ band. `python_version` is
    # always MAJOR.MINOR, so `== '3.12'` still matches 3.12.7; a `< '3.13'` bound
    # would also catch 3.11 and fail resolution there.
    "groundrails>=1.0.35; python_version == '3.12'",
    "langdetect>=1.0.9",            # document-processing: source language detection (extractors.py)
    "numpy",                        # svg_tools geometry
    "odfpy>=1.4",                   # document-processing: ODT extraction (extractors.py)
    "onnxtr[cpu-headless]>=0.8",    # document-processing: ONNX OCR engine (ocr.py); cpu-headless pulls opencv-python-headless -> no libGL/OS dep
    "pandas>=2.0",                  # document-processing train-lexical dataset read
    "pillow",
    "playwright",
    "pyarrow>=14.0",                # document-processing train-lexical: parquet dataset read (via pandas)
    "pygal",
    "pypdf>=4.0",                   # document-processing: PDF extraction (extractors.py)
    "python-docx>=1.0",            # document-processing: DOCX extraction (extractors.py)
    "pyyaml",
    "scipy",                        # svg_tools geometry
    "shapely",
    "striprtf>=0.0.26",            # document-processing: RTF extraction (extractors.py)
    "svgelements>=1.9",
    "tiktoken",
    "transitions",
]

[project.optional-dependencies]
dev = [
    "build",
    "ipython",
    "jenkspy",                     # max-gap / natural-breaks batch threshold experiment
    "jupyter",
    "pip",
    "pytest",
    "pytest-cov",
    "ruff",
    "twine",
]
semantic = [
    # groundrails owns the semantic cascade (OpenVINO bge-m3 + reranker + NLI);
    # `[all]` covers both its ONNX and OpenVINO semantic paths. Marker per the core
    # dep above; being this extra's only member, `[semantic]` installs nothing off 3.12.
    "groundrails[all]>=1.0.35; python_version == '3.12'",
]

[project.scripts]
orchestrate = "stellars_claude_code_plugins.autobuild.orchestrator:main"
svg-infographics = "stellars_claude_code_plugins.svg_tools.cli:main"
journal-tools = "stellars_claude_code_plugins.journal.journal_tools:main"
hypothesis-tools = "stellars_claude_code_plugins.hypothesis.hypothesis_tools:main"
pm-tools = "stellars_claude_code_plugins.project_management.pm_tools:main"
render-png = "stellars_claude_code_plugins.svg_tools.render_png:main"
document-processing = "stellars_claude_code_plugins.document_processing.cli:main"
review-tools = "stellars_claude_code_plugins.review.review_tools:main"

[project.urls]
Homepage = "https://github.com/stellarshenson/claude-code-plugins"
Repository = "https://github.com/stellarshenson/claude-code-plugins"
Issues = "https://github.com/stellarshenson/claude-code-plugins/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"stellars_claude_code_plugins.autobuild" = ["resources/*.yaml"]
"stellars_claude_code_plugins.journal" = ["prompts/*.yaml"]
"stellars_claude_code_plugins.document_processing" = ["models/*.onnx"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["stellars_claude_code_plugins*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 99
src = ["src"]
include = ["pyproject.toml", "src/stellars_claude_code_plugins/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["stellars_claude_code_plugins"]
force-sort-within-sections = true

[tool.pytest.ini_options]
testpaths = ["tests"]
