name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: ['*']

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v4
      # `uv run` resolves from uv.lock, so CI lints with the ruff version the lockfile
      # pins. `uvx ruff` fetched the newest release instead, which turns CI red on a
      # ruff release that adds a default rule - with no change to this repo.
      - name: Lint
        run: |
          uv run --extra dev ruff format --check
          uv run --extra dev ruff check

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The whole supported band. 3.11 is the floor `requires-python` advertises;
        # 3.13 is where the plugin-facing interpreters live. groundrails (and so the
        # document-processing suite) only installs on 3.12 - those tests skip on the
        # other two, which is the marker working as designed.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        run: |
          uv venv .venv --python ${{ matrix.python-version }}
          uv pip install --python .venv -e ".[dev]"
      - name: Run tests
        run: |
          .venv/bin/pytest tests/ -v --tb=short --cov
      - name: Validate YAML model
        run: |
          .venv/bin/python -c "
          from stellars_claude_code_plugins.autobuild.model import load_model, validate_model
          from pathlib import Path
          model = load_model(Path('src/stellars_claude_code_plugins/autobuild/resources'))
          issues = validate_model(model)
          assert not issues, f'Validation failed: {issues}'
          print('Model validation: OK')
          "
      # A release syncs every plugin string to the library version by hand. Nothing used
      # to verify it, so a desync would ship a broken marketplace with CI still green.
      - name: Plugin versions match the library
        run: |
          .venv/bin/python -c "
          import json, re, sys, pathlib
          root = pathlib.Path('.')
          v = re.search(r'^version\s*=\s*\"([^\"]+)\"', (root/'pyproject.toml').read_text(), re.M).group(1)
          plugins = ['autobuild','datascience','devils-advocate','document-processing','journal','project-management','svg-infographics']
          bad = []
          for p in plugins:
              pv = json.loads((root/p/'.claude-plugin/plugin.json').read_text())['version']
              if pv != v: bad.append(f'{p}/.claude-plugin/plugin.json: {pv} != {v}')
          m = json.loads((root/'.claude-plugin/marketplace.json').read_text())
          if m['metadata']['version'] != v:
              bad.append(f\"marketplace metadata: {m['metadata']['version']} != {v}\")
          for p in m['plugins']:
              if p['version'] != v: bad.append(f\"marketplace entry {p['name']}: {p['version']} != {v}\")
          if bad:
              print(f'Plugin versions out of sync with library {v}:')
              [print('  ' + b) for b in bad]
              sys.exit(1)
          n = len(plugins) + 1 + len(m['plugins'])
          print(f'OK: all {n} plugin strings match library version {v}')
          "
      # Guards the phantom-command class of defect: a command advertised in a README
      # whose target skill does not exist. Shipped once in v1.6.21, fixed in v1.6.22.
      - name: Commands resolve to real skills
        run: |
          .venv/bin/python -c "
          import re, sys, pathlib
          root = pathlib.Path('.')
          bad, checked = [], 0
          for f in sorted(root.glob('*/commands/*.md')):
              for ref in sorted(set(re.findall(r'[a-z-]+/skills/[a-z-]+/SKILL\.md', f.read_text()))):
                  checked += 1
                  if not (root / ref).is_file(): bad.append(f'{f} -> {ref}')
          if bad:
              print('BROKEN command -> skill references:')
              [print('  ' + b) for b in bad]
              sys.exit(1)
          print(f'OK: {checked} command -> skill references all resolve')
          "

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        run: |
          uv venv .venv
          uv pip install --python .venv -e ".[dev]"
      - name: Build wheel
        run: |
          uv pip install --python .venv build
          .venv/bin/python -m build --wheel
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package-artifacts
          path: dist/stellars_claude_code_plugins*.whl
          if-no-files-found: error

  test-install:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: package-artifacts
      - name: Install from wheel and verify
        run: |
          pip install stellars_claude_code_plugins*.whl
          python -c "from stellars_claude_code_plugins.autobuild.orchestrator import main; print('Import OK')"
          python -c "from stellars_claude_code_plugins.autobuild.model import load_model; print('Model import OK')"
          python -c "from stellars_claude_code_plugins.autobuild.fsm import FSM; print('FSM import OK')"
          orchestrate --help

  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          # --accept adds 429: a rate-limited response means the link exists but the
          #   runner was throttled, not that the link is broken (lychee's default
          #   accept list stops at 299, so a 429 was failing the build).
          # --max-concurrency 8: the default 128 hammers github.com / shields.io from a
          #   shared runner IP and provokes the throttling in the first place.
          # Covers the root README plus all seven plugin READMEs - the datascience,
          # document-processing, journal and svg-infographics ones were unchecked, so
          # their links could rot silently.
          # --exclude doi.org: DOIs redirect to publisher hosts (dl.acm.org,
          #   academic.oup.com) that answer a bare bot request with 403. The DOI is
          #   verified real at authoring time against api.crossref.org, which does not
          #   block; the link checker cannot repeat that check, so it skips them.
          args: --no-progress --max-concurrency 8 --accept '100..=103,200..=299,429' --exclude medium.com --exclude pepy.tech --exclude static.pepy.tech --exclude mcpmarket.com --exclude 'github\.com/stellarshenson/knowledge-graph-foundry' --exclude 'doi\.org' README.md autobuild/README.md datascience/README.md devils-advocate/README.md document-processing/README.md journal/README.md project-management/README.md svg-infographics/README.md
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
