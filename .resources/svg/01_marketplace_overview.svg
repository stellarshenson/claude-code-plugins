<!--
  01_marketplace_overview.svg - stellars-claude-code-plugins marketplace hero
  Shows: title band (name + tagline + capability strip) + 6 plugin cards grouped by
  category (Build / Review & Validate / Track) in a 3-column x 2-row grid, plus a
  bottom install-line strip.
  Intent: README hero infographic that says "this marketplace ships plugins for
  structured AI-assisted work" at a glance. The capability strip and tagline
  deliberately name no plugin count and no build-only language.
  Theme: Stellars-Tech (teal primary, gold accent, Segoe UI, flat-top rounded-bottom cards).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 504">
  <style>
    .fg-1 { fill: #1a5a6e; }
    .fg-2 { fill: #24697e; }
    .fg-3 { fill: #236a74; }
    .fg-4 { fill: #2b7680; }
    .accent-1 { fill: #005f7a; }
    .accent-2 { fill: #7a4a15; }
    .on-fill { fill: #e0f2f7; }
    .stroke-1 { stroke: #005f7a; }
    .stroke-2 { stroke: #7a4a15; }
    @media (prefers-color-scheme: dark) {
      .fg-1 { fill: #b8e4f0; }
      .fg-2 { fill: #8fd4e6; }
      .fg-3 { fill: #5aafc5; }
      .fg-4 { fill: #4099b3; }
      .accent-1 { fill: #5cc8e0; }
      .accent-2 { fill: #d4a04a; }
      .on-fill { fill: #0d2530; }
      .stroke-1 { stroke: #5cc8e0; }
      .stroke-2 { stroke: #d4a04a; }
    }
  </style>

  <!-- === GRID REFERENCE ===
    viewBox: 900x504, margin 20 all sides
    Header band: y=20..96 - title(y=42) + tagline(y=64) + capability strip(y=88)
    Category strip: y=114 - 3 column labels
    Row 1 cards: y=134..254 (h=120)
    Row 2 cards: y=278..398 (h=120)
    Install strip: y=422..484 (h=62)
    Columns (268 wide each, 28px gutters):
      col1: x=20..288    (Build: datascience, svg-infographics)
      col2: x=316..584   (Review & Validate: devils-advocate, document-processing)
      col3: x=612..880   (Track: journal, project-management)
    Card template (offset from card top): accent bar 0, title +28, subtitle +48,
      divider +59, chip row +67 (text +77), footer +103
  === -->

  <!-- === LAYOUT TOPOLOGY ===
    v-stack: header, categories, row1, row2, install-strip
    grid: 3 columns x 2 rows
    contain: card > accent-bar, name, tagline, divider, capability-chips, footer-stat
  === -->

  <g id="background">
    <rect x="20" y="422" width="860" height="62" rx="3" fill="#005f7a" fill-opacity="0.06"/>
  </g>

  <g id="nodes">
    <!-- Card 1.1: datascience (col1, row1) -->
    <path d="M20,134 H288 V251 Q288,254 285,254 H23 Q20,254 20,251 Z" fill="#7a4a15" fill-opacity="0.04" stroke="#7a4a15" stroke-width="1"/>
    <rect x="20" y="134" width="268" height="5" fill="#7a4a15" opacity="0.6"/>
    <line x1="36" y1="193" x2="272" y2="193" class="stroke-2" stroke-width="0.5" opacity="0.25"/>
    <rect x="36" y="201" width="60" height="14" rx="2" fill="#7a4a15" fill-opacity="0.08"/>
    <rect x="104" y="201" width="40" height="14" rx="2" fill="#7a4a15" fill-opacity="0.08"/>
    <rect x="152" y="201" width="84" height="14" rx="2" fill="#7a4a15" fill-opacity="0.08"/>

    <!-- Card 1.2: devils-advocate (col2, row1) -->
    <path d="M316,134 H584 V251 Q584,254 581,254 H319 Q316,254 316,251 Z" fill="#005f7a" fill-opacity="0.04" stroke="#005f7a" stroke-width="1"/>
    <rect x="316" y="134" width="268" height="5" fill="#005f7a" opacity="0.6"/>
    <line x1="332" y1="193" x2="568" y2="193" class="stroke-1" stroke-width="0.5" opacity="0.25"/>
    <rect x="332" y="201" width="72" height="14" rx="2" fill="#005f7a" fill-opacity="0.08"/>
    <rect x="412" y="201" width="72" height="14" rx="2" fill="#005f7a" fill-opacity="0.08"/>
    <rect x="492" y="201" width="60" height="14" rx="2" fill="#005f7a" fill-opacity="0.08"/>

    <!-- Card 1.3: journal (col3, row1) -->
    <path d="M612,134 H880 V251 Q880,254 877,254 H615 Q612,254 612,251 Z" fill="#7a4a15" fill-opacity="0.04" stroke="#7a4a15" stroke-width="1"/>
    <rect x="612" y="134" width="268" height="5" fill="#7a4a15" opacity="0.6"/>
    <line x1="628" y1="193" x2="864" y2="193" class="stroke-2" stroke-width="0.5" opacity="0.25"/>
    <rect x="628" y="201" width="48" height="14" rx="2" fill="#7a4a15" fill-opacity="0.08"/>
    <rect x="684" y="201" width="44" height="14" rx="2" fill="#7a4a15" fill-opacity="0.08"/>
    <rect x="736" y="201" width="44" height="14" rx="2" fill="#7a4a15" fill-opacity="0.08"/>

    <!-- Card 2.1: svg-infographics (col1, row2) -->
    <path d="M20,278 H288 V395 Q288,398 285,398 H23 Q20,398 20,395 Z" fill="#005f7a" fill-opacity="0.04" stroke="#005f7a" stroke-width="1"/>
    <rect x="20" y="278" width="268" height="5" fill="#005f7a" opacity="0.6"/>
    <line x1="36" y1="337" x2="272" y2="337" class="stroke-1" stroke-width="0.5" opacity="0.25"/>
    <rect x="36" y="345" width="48" height="14" rx="2" fill="#005f7a" fill-opacity="0.08"/>
    <rect x="92" y="345" width="52" height="14" rx="2" fill="#005f7a" fill-opacity="0.08"/>
    <rect x="152" y="345" width="44" height="14" rx="2" fill="#005f7a" fill-opacity="0.08"/>

    <!-- Card 2.2: document-processing (col2, row2) -->
    <path d="M316,278 H584 V395 Q584,398 581,398 H319 Q316,398 316,395 Z" fill="#005f7a" fill-opacity="0.04" stroke="#005f7a" stroke-width="1"/>
    <rect x="316" y="278" width="268" height="5" fill="#005f7a" opacity="0.6"/>
    <line x1="332" y1="337" x2="568" y2="337" class="stroke-1" stroke-width="0.5" opacity="0.25"/>
    <rect x="332" y="345" width="52" height="14" rx="2" fill="#005f7a" fill-opacity="0.08"/>
    <rect x="392" y="345" width="60" height="14" rx="2" fill="#005f7a" fill-opacity="0.08"/>
    <rect x="460" y="345" width="56" height="14" rx="2" fill="#005f7a" fill-opacity="0.08"/>

    <!-- Card 2.3: project-management (col3, row2) -->
    <path d="M612,278 H880 V395 Q880,398 877,398 H615 Q612,398 612,395 Z" fill="#7a4a15" fill-opacity="0.04" stroke="#7a4a15" stroke-width="1"/>
    <rect x="612" y="278" width="268" height="5" fill="#7a4a15" opacity="0.6"/>
    <line x1="628" y1="337" x2="864" y2="337" class="stroke-2" stroke-width="0.5" opacity="0.25"/>
    <rect x="628" y="345" width="68" height="14" rx="2" fill="#7a4a15" fill-opacity="0.08"/>
    <rect x="704" y="345" width="76" height="14" rx="2" fill="#7a4a15" fill-opacity="0.08"/>
    <rect x="788" y="345" width="44" height="14" rx="2" fill="#7a4a15" fill-opacity="0.08"/>
  </g>

  <g id="connectors"></g>

  <g id="content">
    <!-- === HEADER BAND === -->
    <text x="20" y="42" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" class="fg-1">stellars-claude-code-plugins</text>
    <text x="20" y="64" font-family="Segoe UI, Arial, sans-serif" font-size="11" class="fg-3">Claude Code plugins with fixed procedures and checks for data science, diagrams, reviews, documents and project tracking</text>
    <text x="20" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="9" class="fg-4" letter-spacing="1">PYPI LIBRARY - PYTHON 3.10+ - DARK MODE - MIT</text>

    <!-- === CATEGORY LABELS === -->
    <text x="154" y="114" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="600" class="accent-1" letter-spacing="1.5" text-anchor="middle">BUILD</text>
    <text x="450" y="114" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="600" class="accent-1" letter-spacing="1.5" text-anchor="middle">REVIEW &amp; VALIDATE</text>
    <text x="746" y="114" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="600" class="accent-1" letter-spacing="1.5" text-anchor="middle">TRACK</text>

    <!-- Card 1.1: datascience -->
    <text x="36" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" class="fg-1">datascience</text>
    <text x="36" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="10" class="fg-3">Notebooks and projects to standards</text>
    <text x="66" y="211" font-family="Segoe UI, Arial, sans-serif" font-size="7" font-weight="600" class="fg-2" text-anchor="middle">15 COMMANDS</text>
    <text x="124" y="211" font-family="Segoe UI, Arial, sans-serif" font-size="7" font-weight="600" class="fg-2" text-anchor="middle">COPIER</text>
    <text x="194" y="211" font-family="Segoe UI, Arial, sans-serif" font-size="7" font-weight="600" class="fg-2" text-anchor="middle">HYPOTHESIS LEDGER</text>
    <text x="36" y="237" font-family="Segoe UI, Arial, sans-serif" font-size="8" class="fg-4">Templates + hypothesis ledgers + rich output</text>

    <!-- Card 1.2: devils-advocate -->
    <text x="332" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" class="fg-1">devils-advocate</text>
    <text x="332" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="10" class="fg-3">Document critique + adversarial code review</text>
    <text x="368" y="211" font-family="Segoe UI, Arial, sans-serif" font-size="7" font-weight="600" class="fg-2" text-anchor="middle">FIBONACCI 1-64</text>
    <text x="448" y="211" font-family="Segoe UI, Arial, sans-serif" font-size="7" font-weight="600" class="fg-2" text-anchor="middle">13 ADVERSARIES</text>
    <text x="522" y="211" font-family="Segoe UI, Arial, sans-serif" font-size="7" font-weight="600" class="fg-2" text-anchor="middle">ADJUDICATOR</text>
    <text x="332" y="237" font-family="Segoe UI, Arial, sans-serif" font-size="8" class="fg-4">Risk scores + code red-team + residual risk</text>

    <!-- Card 1.3: journal -->
    <text x="628" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" class="fg-1">journal</text>
    <text x="628" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="10" class="fg-3">Append-only project journal</text>
    <text x="652" y="211" font-family="Segoe UI, Arial, sans-serif" font-size="7" font-weight="600" class="fg-2" text-anchor="middle">NUMBERED</text>
    <text x="706" y="211" font-family="Segoe UI, Arial, sans-serif" font-size="7" font-weight="600" class="fg-2" text-anchor="middle">4 TIERS</text>
    <text x="758" y="211" font-family="Segoe UI, Arial, sans-serif" font-size="7" font-weight="600" class="fg-2" text-anchor="middle">ARCHIVE</text>
    <text x="628" y="237" font-family="Segoe UI, Arial, sans-serif" font-size="8" class="fg-4">Continuous numbering + length tiers + archive</text>

    <!-- Card 2.1: svg-infographics -->
    <text x="36" y="306" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" class="fg-1">svg-infographics</text>
    <text x="36" y="326" font-family="Segoe UI, Arial, sans-serif" font-size="10" class="fg-3">Grid-first SVG infographics</text>
    <text x="60" y="355" font-family="Segoe UI, Arial, sans-serif" font-size="7" font-weight="600" class="fg-2" text-anchor="middle">29 TOOLS</text>
    <text x="118" y="355" font-family="Segoe UI, Arial, sans-serif" font-size="7" font-weight="600" class="fg-2" text-anchor="middle">DARK MODE</text>
    <text x="174" y="355" font-family="Segoe UI, Arial, sans-serif" font-size="7" font-weight="600" class="fg-2" text-anchor="middle">WCAG AA</text>
    <text x="36" y="381" font-family="Segoe UI, Arial, sans-serif" font-size="8" class="fg-4">29-tool CLI + validators + finalize gate</text>

    <!-- Card 2.2: document-processing -->
    <text x="332" y="306" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" class="fg-1">document-processing</text>
    <text x="332" y="326" font-family="Segoe UI, Arial, sans-serif" font-size="10" class="fg-3">Source-grounded structured processing</text>
    <text x="358" y="355" font-family="Segoe UI, Arial, sans-serif" font-size="7" font-weight="600" class="fg-2" text-anchor="middle">GROUNDING</text>
    <text x="422" y="355" font-family="Segoe UI, Arial, sans-serif" font-size="7" font-weight="600" class="fg-2" text-anchor="middle">PDF TOOLKIT</text>
    <text x="488" y="355" font-family="Segoe UI, Arial, sans-serif" font-size="7" font-weight="600" class="fg-2" text-anchor="middle">VALIDATION</text>
    <text x="332" y="381" font-family="Segoe UI, Arial, sans-serif" font-size="8" class="fg-4">Claim grounding + rules validation + PDF toolkit</text>

    <!-- Card 2.3: project-management -->
    <text x="628" y="306" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" class="fg-1">project-management</text>
    <text x="628" y="326" font-family="Segoe UI, Arial, sans-serif" font-size="10" class="fg-3">Acceptance criteria and defects tracking</text>
    <text x="662" y="355" font-family="Segoe UI, Arial, sans-serif" font-size="7" font-weight="600" class="fg-2" text-anchor="middle">PERMANENT IDS</text>
    <text x="742" y="355" font-family="Segoe UI, Arial, sans-serif" font-size="7" font-weight="600" class="fg-2" text-anchor="middle">SEVERITY TRIAGE</text>
    <text x="810" y="355" font-family="Segoe UI, Arial, sans-serif" font-size="7" font-weight="600" class="fg-2" text-anchor="middle">REPORTS</text>
    <text x="628" y="381" font-family="Segoe UI, Arial, sans-serif" font-size="8" class="fg-4">Permanent ids + severity triage + computed reports</text>

    <!-- === BOTTOM INSTALL STRIP === -->
    <text x="36" y="444" font-family="Segoe UI, Arial, sans-serif" font-size="8" font-weight="600" class="accent-1" letter-spacing="1">INSTALL</text>
    <text x="36" y="464" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" class="fg-1">/plugin marketplace add https://github.com/stellarshenson/claude-code-plugins.git</text>
    <text x="865" y="464" font-family="Segoe UI, Arial, sans-serif" font-size="8" class="fg-4" text-anchor="end">github.com/stellarshenson/claude-code-plugins</text>
  </g>

  <g id="callouts"></g>
</svg>
